<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disparador de Email - Novo Mundo</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-card">
                <div class="login-logo">
                    <img src="../templates/LOGO-NOVO-MUNDO-PEQUENA.png" alt="Novo Mundo" class="img-fluid mb-4">
                </div>
                <h2 class="text-center mb-4">Disparador de Email</h2>
                <p class="text-center text-muted mb-4">Sistema de Gestão de Envios</p>
                
                <div class="d-grid">
                    <button id="loginButton" class="btn btn-primary btn-lg">
                        <i class="fab fa-microsoft me-2"></i>
                        Entrar com Office 365
                    </button>
                </div>
                
                <div id="loginMessage" class="mt-3"></div>
                
                <div class="mt-4 text-center">
                    <small class="text-muted">
                        <i class="fas fa-info-circle me-1"></i>
                        Exclua o arquivo 'token_cache.json' se precisar re-autorizar permissões.
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="main-app d-none">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <img src="../templates/LOGO-NOVO-MUNDO-PEQUENA.png" alt="Logo" class="sidebar-logo">
                <h4 class="sidebar-title">Disparador Email</h4>
                <button id="sidebarToggle" class="btn-toggle d-lg-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#dashboard" class="nav-link active" data-page="dashboard">
                        <i class="fas fa-calendar-check"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#prestadores" class="nav-link" data-page="prestadores">
                        <i class="fas fa-user-tie"></i>
                        <span>Prestadores</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#montadores" class="nav-link" data-page="montadores">
                        <i class="fas fa-hard-hat"></i>
                        <span>Montadores</span>
                    </a>
                </li>
            </ul>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="user-details">
                        <span id="userName" class="user-name">Usuário</span>
                        <button id="logoutButton" class="btn-logout">
                            <i class="fas fa-sign-out-alt"></i>
                            Sair
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Mobile Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay d-lg-none"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-content">
                    <button id="menuToggle" class="btn-menu d-lg-none">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-title">
                        <h1 id="pageTitle">Dashboard de Pendências</h1>
                    </div>
                    <div class="top-bar-actions">
                        <button id="showLogsButton" class="btn btn-outline-info me-2" title="Ver Logs do Sistema">
                            <i class="fas fa-bug"></i>
                        </button>
                        <div class="user-dropdown dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="fas fa-user-circle me-2"></i>
                                <span id="topBarUserName">Usuário</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" id="logoutButtonTop">
                                    <i class="fas fa-sign-out-alt me-2"></i>Sair
                                </a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Wrapper -->
            <div class="content-wrapper">
                <div id="pageContent" class="page-content">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="loading-text mt-3">Carregando...</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Modal de Logs -->
    <div class="modal fade" id="logsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-bug me-2"></i>Logs do Sistema
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between mb-3">
                        <div>
                            <button id="refreshLogsButton" class="btn btn-primary btn-sm">
                                <i class="fas fa-sync-alt me-1"></i>Atualizar
                            </button>
                            <button id="clearLogsButton" class="btn btn-danger btn-sm">
                                <i class="fas fa-trash me-1"></i>Limpar
                            </button>
                        </div>
                        <div>
                            <small class="text-muted">Últimos 100 logs</small>
                        </div>
                    </div>
                    <div id="logsContainer" style="height: 400px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 12px;">
                        <!-- Logs serão inseridos aqui -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/app.js"></script>
</body>
</html>
